<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Web</title>
    <script type="module" src="../js/components/SideBar.js"></script>
    <link rel="stylesheet" href="../assets/styles/output.css" />
    <script defer type="module" src="../js/to-do-list.js"></script>
  </head>
  <body class="flex flex-col h-dvh w-dvw overflow-hidden sm:px-20">
    <side-bar></side-bar>

    <div class="flex-1 flex flex-col h-full relative overflow-hidden">
      <header class="bg-white flex flex-col gap-4 p-4 shadow-sm z-10 shrink-0">
        <h2 class="subtitle font-bold text-xl text-primary">
          Listado de tareas
        </h2>

        <form class="flex flex-col md:flex-row gap-3 w-full" id="task-form">
          <div
            class="relative flex items-center justify-center w-full md:flex-1"
          >
            <svg class="size-6 absolute left-3 text-button">
              <use href="../assets/img/sprite.svg#tasks"></use>
            </svg>
            <input
              type="text"
              class="input-text w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              id="task-input"
              required
              placeholder="Nueva tarea..."
            />
          </div>

          <div class="flex gap-2 w-full md:w-auto">
            <select
              name="priority"
              id="task-priority"
              class="w-1/2 md:w-auto px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white"
              required
            >
              <option value="1">Baja</option>
              <option value="2">Media</option>
              <option value="3">Alta</option>
            </select>

            <input
              class="w-1/2 md:w-auto px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white"
              type="date"
              id="task-date"
              required
            />
          </div>

          <div>
            <button
              type="submit"
              id="add-task"
              class="button-primary w-full md:w-auto px-6 py-2"
            >
              Agregar
            </button>
            <button
              id="edit-task"
              type="submit"
              class="hidden button-primary w-full md:w-auto px-6 py-2"
            >
              Editar
            </button>
          </div>
        </form>
      </header>

      <main class="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth">
        <ol
          id="task-list"
          class="w-full max-w-4xl mx-auto flex flex-col gap-3 pb-10"
        ></ol>
      </main>
    </div>
  </body>
</html>
