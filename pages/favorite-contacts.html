<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Web</title>
    <link rel="stylesheet" href="../src/styles/output.css" />
    <script type="module" src="../src/js/favorite-contacts.js"></script>
    <script type="module" src="../src/js/components/SideBar.js"></script>
  </head>

  <body class="min-h-screen flex flex-col gap-6 justify-center items-center">
    <header class="bg-white z-50 sticky top-0 w-full px-4">
      <section
        class="bg-white border-b border-gray-300 p-4 flex justify-between w-full max-w-7xl mx-auto"
      >
        <section class="sm:block hidden">
          <h2 class="subtitle">Contactos Favoritos</h2>
          <span class="text-button text-sm total-contacts"></span>
        </section>

        <section class="flex gap-2 w-full sm:w-auto">
          <search
            class="relative flex items-center justify-center w-full sm:w-auto"
          >
            <svg class="absolute left-4 text-button" width="20" height="20">
              <use href="../assets/img/sprite.svg#search"></use>
            </svg>
            <input
              id="search"
              type="search"
              class="input-text w-full sm:w-auto search"
              placeholder="Buscar"
            />
          </search>
        </section>
      </section>
    </header>

    <side-bar></side-bar>

    <section class="sm:hidden block">
      <h2 class="subtitle">Contactos Favoritos</h2>
      <span class="text-button text-sm total-contacts"></span>
    </section>
    <main
      class="sm:mt-16 flex flex-col sm:grid sm:grid-cols-[repeat(auto-fit,minmax(250px,1fr))] gap-2 sm:gap-12 mb-32 w-full max-w-7xl mx-auto"
    ></main>
  </body>
</html>
